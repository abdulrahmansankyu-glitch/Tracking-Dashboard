# Keep the tracker awake during working hours.
#
# A free Render service sleeps after 15 minutes without traffic, and the next
# person to open it waits about 50 seconds looking at Render's "service waking
# up" screen. Any inbound request resets that idle timer, so a small ping every
# five minutes keeps the service up and nobody on the plant ever sees it.
#
# It deliberately does NOT run around the clock. Render's free tier allows 750
# instance-hours a month per workspace; awake 24/7 is about 730 of them, which
# would consume the entire allowance and leave nothing for any other service in
# the same workspace. Sunday to Thursday, 05:00-18:00 local, is roughly 280
# hours — the service still sleeps overnight and at weekends, when nobody is
# looking at it anyway.
#
# Needs one repository secret, the same one the reminder workflow uses:
#
#   TRACKER_URL   https://engineering-tracker.onrender.com
#
# This is a workaround for a free plan, not a fix. Render's paid instance
# (about $7/month) never sleeps, and this workflow can then be deleted.

name: Keep tracker awake

on:
  schedule:
    # Every 5 minutes, 02:00-14:55 UTC, Sunday to Thursday.
    #
    # GitHub runs cron in UTC with no local-time option, so the plant's hours
    # are converted by hand: Saudi Arabia is UTC+3 and does not observe daylight
    # saving, making this 05:00-17:55 local. Day 0 is Sunday, so 0-4 is the
    # Sunday-to-Thursday working week.
    #
    # Five minutes rather than ten because GitHub's scheduled runs are best
    # effort and are often delayed by several minutes under load — at a ten
    # minute interval a single delayed run is enough to let the service sleep.
    - cron: '*/5 2-14 * * 0-4'
  workflow_dispatch:

concurrency:
  group: tracker-keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          TRACKER_URL: ${{ secrets.TRACKER_URL }}
        # `/api/health` is the cheapest route that touches the app: no database
        # query, no session, and it is already what the reminder workflow waits
        # on. `--max-time 90` covers the case where this ping is itself the
        # request that wakes a sleeping instance.
        #
        # A failure is not worth failing the workflow over. This job runs 150
        # times a week; a red cross every time Render blips would train everyone
        # to ignore the Actions tab, including when the reminder job fails.
        run: |
          if [ -z "$TRACKER_URL" ]; then
            echo "::warning::TRACKER_URL is not set — nothing to ping."
            exit 0
          fi
          # No `|| echo 000` fallback: curl already writes 000 through -w when it
          # cannot connect, so the two together produced "000000" and a warning
          # quoting a status code that does not exist.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$TRACKER_URL/api/health" 2>&1 | tail -n1)
          echo "$TRACKER_URL/api/health -> ${code:-no answer}"
          if [ "$code" != "200" ]; then
            echo "::warning::Health check answered ${code:-nothing}."
          fi
