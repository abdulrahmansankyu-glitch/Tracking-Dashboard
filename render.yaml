# One-click deploy for Intoto ERP.
#
#   https://dashboard.render.com/blueprints → New Blueprint Instance
#
# Deliberately NOT Docker. Two attempts at Docker images failed on the seams between
# pnpm's symlinked node_modules and the image build. Render's native Node runtime runs
# the same commands the project already uses in development, so there is far less between
# the source and a running process — and any failure names the actual command that broke.
#
# Free tier, with two limits worth knowing before you rely on it:
#   * Services sleep after 15 minutes idle and take ~50s to wake.
#   * The free database is REMOVED AFTER 30 DAYS. Fine for trying the system out;
#     before you bill real customers, move to a paid database or to Neon's free tier
#     (which persists) — see DEPLOYMENT.md.

databases:
  - name: intoto-db
    databaseName: intoto_erp
    user: intoto
    plan: free
    region: singapore # closest Render region to India

services:
  # ---------------- Backend ----------------
  - type: web
    name: intoto-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    healthCheckPath: /api/v1/health

    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @intoto/shared build &&
      pnpm --filter @intoto/api exec prisma generate &&
      pnpm --filter @intoto/api build

    # Migrations run before the server accepts traffic, so the process never serves
    # against a schema it does not match. The seed only fills an empty database, so a
    # fresh deployment is usable on arrival instead of showing a login screen with no
    # accounts — and a restart never disturbs real data.
    startCommand: sh infra/render/start-api.sh

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: intoto-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      # Generated once and kept stable across deploys. Changing either signs everyone out.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Encrypts supplier bank details at rest.
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: intoto-web
          property: host
      - key: DEFAULT_STATE_CODE
        value: "09"
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: STORAGE_DRIVER
        value: local
      - key: AI_ENABLED
        value: false
      - key: RUN_SEED_ON_BOOT
        value: "true"

  # ---------------- Screens ----------------
  - type: web
    name: intoto-web
    runtime: node
    plan: free
    region: singapore
    rootDir: .

    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @intoto/shared build &&
      pnpm --filter @intoto/web build

    # Bound to 0.0.0.0 — the default localhost bind makes the service unreachable from
    # outside, which looks identical to a crash.
    startCommand: cd apps/web && ./node_modules/.bin/next start -H 0.0.0.0 -p $PORT

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # The browser calls this server's own origin and Next proxies through to the API.
      # Next bakes NEXT_PUBLIC_* into the bundle at build time, so it cannot be handed an
      # address that only exists once the host assigns one; the proxy keeps the backend
      # address a runtime value, and removes cross-origin requests entirely.
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: intoto-api
          property: host
      - key: NEXT_PUBLIC_APP_NAME
        value: Intoto ERP
      # Opens the app without a login screen, using the seeded owner account.
      #
      # This puts a working password into the browser bundle, so it is safe only while the
      # database holds nothing but seed data. SET THIS TO false BEFORE ENTERING REAL SALES,
      # then redeploy — the normal sign-in form is always there underneath.
      - key: NEXT_PUBLIC_DEMO_LOGIN
        value: "true"
